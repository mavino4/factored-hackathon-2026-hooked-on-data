# TLS terminator for the EC2 host. nginx uses the host network and proxies to the
# app published on 127.0.0.1:8000. The certificate is written by deploy/ec2-start.sh
# for the instance's current public address (browsers warn until it is trusted).
server {
    listen 443 ssl;
    http2 on;

    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:tls:10m;
    ssl_session_timeout 1h;

    # Voice recordings (the app refuses more than AIP_VOICE_MAX_BYTES, 2 MB).
    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        # SSE: don't buffer, allow long-lived streams.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
