# Helm values for self-hosted Langfuse v4 on Kubernetes (official chart, v2.x):
#
#   helm repo add langfuse https://langfuse.github.io/langfuse-k8s
#   helm install langfuse langfuse/langfuse --version 2.1.3 -n langfuse --create-namespace \
#     -f deploy/langfuse/values.yaml
#
# Prerequisites (once per cluster): cert-manager and the ClickHouse operator. See
# docs/deploy.md, "Tracing (Langfuse)". Validated with chart 2.1.3 (`helm template`).
#
# Secrets are never in this file. Create "langfuse-secrets" first (keys below). With
# ArgoCD or `helm template` pipelines, pin them all like this, because the chart's
# auto-generated secrets would rotate on each sync and break the stored API keys.
langfuse:
  salt:
    secretKeyRef: {name: langfuse-secrets, key: salt}
  encryptionKey:
    secretKeyRef: {name: langfuse-secrets, key: encryption-key}
  nextauth:
    url: https://langfuse.internal.example  # CHANGEME: the internal URL of the UI
    secret:
      secretKeyRef: {name: langfuse-secrets, key: nextauth-secret}
  features:
    telemetryEnabled: false
    signUpDisabled: true
  # Log in through the same OIDC provider as the app (e.g. Auth0), no local passwords.
  auth:
    disableUsernamePassword: true
    providers:
      custom:
        name: SSO
        issuer: https://your-tenant.eu.auth0.com/  # CHANGEME
        clientId: replace-with-langfuse-client-id  # CHANGEME
        clientSecret:
          secretKeyRef: {name: langfuse-secrets, key: oidc-client-secret}
  # Internal only: reachable from the office network / VPN, never public.
  ingress:
    enabled: true
    className: nginx-internal  # CHANGEME: your internal ingress class
    hosts:
      - host: langfuse.internal.example  # CHANGEME
        paths:
          - path: /
            pathType: Prefix
    tls:
      enabled: true
      secretName: langfuse-tls

# Managed Postgres (backups, HA) instead of the bundled single instance.
postgresql:
  deploy: false
  host: langfuse-db.internal.example  # CHANGEME
  auth:
    username: langfuse
    database: langfuse
    existingSecret: langfuse-secrets
    secretKeys:
      userPasswordKey: postgres-password

# ClickHouse (the trace store) through the operator. See docs/deploy.md for sizing.
clickhouse:
  deploy: true
  auth:
    existingSecret: langfuse-secrets
    existingSecretKey: clickhouse-password

redis:
  deploy: true
  auth:
    existingSecret: langfuse-secrets
    existingSecretPasswordKey: redis-password
    # Valkey ACL users: one key per username, so the Secret also needs `default`
    # (same value as redis-password).
    usersExistingSecret: langfuse-secrets

# Your cloud's object storage for event and media blobs, instead of the bundled SeaweedFS.
s3:
  deploy: false
  bucket: langfuse-traces  # CHANGEME
  region: us-east-1  # CHANGEME
  endpoint: https://s3.us-east-1.amazonaws.com  # CHANGEME
  forcePathStyle: false
  accessKeyId:
    secretKeyRef: {name: langfuse-secrets, key: s3-access-key-id}
  secretAccessKey:
    secretKeyRef: {name: langfuse-secrets, key: s3-secret-access-key}
