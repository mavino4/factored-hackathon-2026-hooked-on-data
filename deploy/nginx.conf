# Round-robin across app replicas (Docker DNS returns every replica for "app").
upstream app { server app:8000; }

server {
    listen 80;
    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # SSE: don't buffer, allow long-lived streams.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
