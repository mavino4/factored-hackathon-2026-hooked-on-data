# nginx.conf for the LAN demo (docker-compose.lan.yml): HTTPS with the certificate from
# deploy/tls (make tls), plus per-client-IP rate limits: one on the API, and a stricter
# one on sign-in so passwords can't be guessed in bulk (the app also locks an account
# after repeated failures).
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=6r/m;

upstream app { server app:8000; }

# Plain HTTP (host port 8000): nothing is served here but the way to HTTPS.
server {
    listen 80;

    # The demo's certificate authority, for devices to install and trust (public data).
    location = /ca.crt {
        alias /etc/nginx/tls/ca.crt;
        default_type application/x-x509-ca-cert;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:tls:10m;
    ssl_session_timeout 1h;

    # Operator API (human handoffs): this machine only. Its requests arrive from the compose
    # network's gateway (docker-compose.lan.yml); LAN clients keep their own address.
    location /v1/admin/ {
        allow 172.30.0.1;
        deny all;
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /v1/auth/login {
        limit_req zone=login burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The client's address, for the app's audit trail (auth_events).
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /v1/ {
        limit_req zone=per_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE: don't buffer, allow long-lived streams.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
