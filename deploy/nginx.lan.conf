# nginx.conf plus a per-client-IP rate limit on the API, for the LAN demo
# (docker-compose.lan.yml). Dev login lets a client switch usernames, so the app's
# per-user limits alone don't bound one device.
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=30r/m;

upstream app { server app:8000; }

server {
    listen 80;

    location /v1/ {
        limit_req zone=per_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # SSE: don't buffer, allow long-lived streams.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
