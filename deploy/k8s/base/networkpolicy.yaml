apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aiplatform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aiplatform
  policyTypes: [Ingress, Egress]
  ingress:
    # Only the ingress controller and the monitoring stack may reach the API.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Model providers and the OIDC issuer (HTTPS), and Postgres.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
