apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Namespace-agnostic base. The Secret "aiplatform-secrets" is NOT managed here:
# create it with kubectl or an external secrets operator (see secret.example.yaml).
labels:
  - pairs:
      app.kubernetes.io/name: aiplatform
      app.kubernetes.io/part-of: aiplatform
    includeSelectors: false
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - hpa.yaml
  - networkpolicy.yaml
  - ingress.yaml
  - migrate-job.yaml
images:
  - name: aiplatform
    newName: aiplatform
    newTag: latest
