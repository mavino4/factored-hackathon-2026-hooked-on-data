# EXAMPLE ONLY - not referenced by kustomization.yaml. Never commit real values.
# Create the real Secret with:
#   kubectl -n <namespace> create secret generic aiplatform-secrets \
#     --from-literal=AIP_DATABASE_URL='postgresql+asyncpg://USER:PASS@HOST:5432/aiplatform' \
#     --from-literal=ANTHROPIC_API_KEY='sk-ant-...'
# or sync it from your cloud secret manager with the External Secrets Operator.
apiVersion: v1
kind: Secret
metadata:
  name: aiplatform-secrets
type: Opaque
stringData:
  AIP_DATABASE_URL: postgresql+asyncpg://USER:PASS@HOST:5432/aiplatform
  ANTHROPIC_API_KEY: sk-ant-REPLACE_ME
  # Read-only role on the core-banking DB (Row-Level Security limits it to the session's customer).
  AIP_BANK_DATABASE_URL: postgresql+asyncpg://bank_reader:PASS@BANK_HOST:5432/bank
  # Langfuse project API keys (Langfuse UI > Project settings > API keys).
  LANGFUSE_PUBLIC_KEY: pk-lf-REPLACE_ME
  LANGFUSE_SECRET_KEY: sk-lf-REPLACE_ME
  # Key for the user-ID pseudonyms in traces: `openssl rand -hex 32`. Keep it stable.
  AIP_TRACE_HASH_KEY: REPLACE_ME
