apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aiplatform
resources:
  - namespace.yaml
  - ../../base
images:
  - name: aiplatform
    newName: registry.example.com/aiplatform  # replace with your registry
    newTag: "0.1.0"                            # replace per release (e.g. git SHA)
replicas:
  - name: aiplatform
    count: 2
patches:
  - target:
      kind: Ingress
      name: aiplatform
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: ai.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: ai.example.com
