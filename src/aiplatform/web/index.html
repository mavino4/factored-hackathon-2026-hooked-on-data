<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BankBot</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/i18n.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <!-- Login -->
  <main id="login" class="login" hidden>
    <select class="lang-select login-lang" aria-label="Language" data-i18n-aria-label="language">
      <option value="es">Español</option>
      <option value="pt">Português</option>
      <option value="en">English</option>
    </select>
    <div class="login-card">
      <h1 data-i18n="app_title">BankBot</h1>
      <p class="muted" id="login-hint" data-i18n="login_hint">Sign in to continue.</p>
      <form id="dev-login" hidden>
        <label for="dev-user" data-i18n="username_label">Username (dev mode)</label>
        <input id="dev-user" required pattern="[A-Za-z0-9._\-]{1,40}" autocomplete="username">
        <button type="submit" class="primary" data-i18n="continue">Continue</button>
      </form>
      <form id="password-login" hidden>
        <label for="login-user" data-i18n="username">Username</label>
        <input id="login-user" required maxlength="64" autocomplete="username"
               autocapitalize="none" spellcheck="false">
        <label for="login-password" data-i18n="password">Password</label>
        <input id="login-password" type="password" required maxlength="256"
               autocomplete="current-password">
        <button type="submit" class="primary" data-i18n="sign_in">Sign in</button>
      </form>
      <button id="oidc-login" class="primary" hidden data-i18n="sign_in">Sign in</button>
      <p class="error" id="login-error" hidden></p>
    </div>
  </main>

  <!-- App -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="sidebar-actions">
        <button id="new-agent" class="primary" data-i18n="new_query">+ New query</button>
      </div>
      <nav>
        <ul id="conversation-list" class="conversation-list"></ul>
      </nav>
      <div class="sidebar-footer">
        <span id="user-name" class="muted"></span>
        <button id="change-password" class="link" hidden data-i18n="change_password">Change password</button>
        <button id="logout" class="link" data-i18n="sign_out">Sign out</button>
      </div>
    </aside>

    <section class="chat">
      <header class="chat-header">
        <button id="toggle-sidebar" class="icon" aria-label="Conversations"
                data-i18n-aria-label="conversations">☰</button>
        <h2 id="chat-title" data-i18n="start">Start a conversation</h2>
        <select id="lang-select" class="lang-select" aria-label="Language"
                data-i18n-aria-label="language">
          <option value="es">Español</option>
          <option value="pt">Português</option>
          <option value="en">English</option>
        </select>
      </header>
      <div id="messages" class="messages" aria-live="polite">
        <div class="empty muted" id="empty-state" data-i18n="empty_state"></div>
      </div>
      <div id="voice-bar" class="voice-bar" hidden>
        <span class="rec-dot" aria-hidden="true"></span>
        <span id="voice-status" role="status"></span>
        <button id="voice-cancel" type="button" class="link" data-i18n="cancel">Cancel</button>
      </div>
      <form id="composer" class="composer">
        <textarea id="input" rows="1" placeholder="Send a message…" data-i18n-placeholder="placeholder"
                  maxlength="20000" disabled></textarea>
        <button id="stop-voice" type="button" class="icon" hidden aria-label="Stop voice"
                data-i18n-aria-label="stop_voice">⏹</button>
        <button id="mic" type="button" class="mic" hidden disabled aria-label="Speak"
                data-i18n-aria-label="speak" aria-pressed="false">🎤</button>
        <button id="send" class="primary" type="submit" disabled data-i18n="send">Send</button>
      </form>
    </section>
  </div>

  <dialog id="password-dialog" class="dialog">
    <form id="password-form">
      <h2 data-i18n="change_password">Change password</h2>
      <label for="current-password" data-i18n="current_password">Current password</label>
      <input id="current-password" type="password" required maxlength="256"
             autocomplete="current-password">
      <label for="new-password" data-i18n="new_password">New password</label>
      <input id="new-password" type="password" required minlength="12" maxlength="256"
             autocomplete="new-password">
      <p class="muted" data-i18n="password_rule">At least 12 characters.</p>
      <p class="error" id="password-error" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="password-cancel" class="link" data-i18n="cancel">Cancel</button>
        <button type="submit" class="primary" data-i18n="save">Save</button>
      </div>
    </form>
  </dialog>
</body>
</html>
