[project]
name = "aiplatform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic[aiohttp,bedrock,vertex]>=1.8.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["postgres: needs a Postgres database (AIP_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
