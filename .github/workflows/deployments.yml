name: Deploy to AWS

on:
  push:
    branches:
      - aws-deploy

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: factored-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::490069156469:role/BackendStack-GitHubActionsRole4F1BBA26-iuyoJdvDVbib 
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          ECR_REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com

          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Run image on EC2
        run: |
          set -euo pipefail
          ECR_REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name BackendStack \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" \
            --output text)
          cat > /tmp/remote.sh <<EOF
          set -eux
          aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}
          docker pull ${IMAGE}
          docker network create factored || true
          docker volume create pgdata || true
          if ! docker inspect factored-db >/dev/null 2>&1; then
            docker run -d --name factored-db --restart unless-stopped \\
              --network factored \\
              -e POSTGRES_USER=aiplatform \\
              -e POSTGRES_PASSWORD=aiplatform \\
              -e POSTGRES_DB=aiplatform \\
              -v pgdata:/var/lib/postgresql/data \\
              postgres:16
          fi
          docker start factored-db
          ready=0
          for _ in \$(seq 1 30); do
            if docker exec factored-db pg_isready -U aiplatform; then
              ready=1
              break
            fi
            sleep 2
          done
          test "\$ready" = 1
          docker run --rm --network factored \\
            -e AIP_DATABASE_URL=postgresql+asyncpg://aiplatform:aiplatform@factored-db:5432/aiplatform \\
            ${IMAGE} /app/.venv/bin/alembic upgrade head
          docker rm -f factored-backend || true
          docker run -d --name factored-backend --restart unless-stopped \\
            --network factored -p 8000:8000 \\
            -e AIP_ENV=dev \\
            -e AIP_AUTH_MODE=dev \\
            -e AIP_DATABASE_URL=postgresql+asyncpg://aiplatform:aiplatform@factored-db:5432/aiplatform \\
            ${IMAGE}
          ok=0
          for _ in \$(seq 1 20); do
            if curl -fsS -m 5 http://127.0.0.1:8000/ -o /dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          test "\$ok" = 1
          EOF
          python3 -c 'import json, pathlib; pathlib.Path("/tmp/ssm-params.json").write_text(json.dumps({"commands": [pathlib.Path("/tmp/remote.sh").read_text()]}))'
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 600 \
            --comment "Run factored-backend" \
            --parameters file:///tmp/ssm-params.json \
            --query Command.CommandId \
            --output text)
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || echo Pending)
            echo "ssm status: $STATUS"
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query StandardOutputContent \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Out:StandardOutputContent,Err:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "timed out waiting for SSM command $COMMAND_ID"
          exit 1

      - name: Print application URLs
        run: |
          URL_IP=$(aws cloudformation describe-stacks \
            --stack-name BackendStack \
            --query "Stacks[0].Outputs[?OutputKey=='BackendUrlIp'].OutputValue" \
            --output text)
          URL_HOST=$(aws cloudformation describe-stacks \
            --stack-name BackendStack \
            --query "Stacks[0].Outputs[?OutputKey=='BackendUrlHost'].OutputValue" \
            --output text)
          echo "URL (IP):   $URL_IP"
          echo "URL (host): $URL_HOST"
