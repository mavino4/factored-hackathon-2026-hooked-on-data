name: Deploy to AWS

on:
  push:
    branches:
      - aws-deploy

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: factored-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::490069156469:role/BackendStack-GitHubActionsRole4F1BBA26-iuyoJdvDVbib 
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          ECR_REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com

          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Run image on EC2
        run: |
          set -euo pipefail
          ECR_REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name BackendStack \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" \
            --output text)
          cat > /tmp/ssm-params.json <<EOF
          {
            "commands": [
              "set -eux",
              "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "docker pull ${IMAGE}",
              "docker rm -f factored-backend || true",
              "docker run -d --name factored-backend --restart unless-stopped -p 8000:8000 -e AIP_ENV=dev -e AIP_AUTH_MODE=dev ${IMAGE}",
              "sleep 3",
              "curl -fsS -m 20 http://127.0.0.1:8000/ -o /dev/null"
            ]
          }
          EOF
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 600 \
            --comment "Run factored-backend" \
            --parameters file:///tmp/ssm-params.json \
            --query Command.CommandId \
            --output text)
          for _ in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || echo Pending)
            echo "ssm status: $STATUS"
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query StandardOutputContent \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Out:StandardOutputContent,Err:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "timed out waiting for SSM command $COMMAND_ID"
          exit 1

      - name: Print application URLs
        run: |
          URL_IP=$(aws cloudformation describe-stacks \
            --stack-name BackendStack \
            --query "Stacks[0].Outputs[?OutputKey=='BackendUrlIp'].OutputValue" \
            --output text)
          URL_HOST=$(aws cloudformation describe-stacks \
            --stack-name BackendStack \
            --query "Stacks[0].Outputs[?OutputKey=='BackendUrlHost'].OutputValue" \
            --output text)
          echo "URL (IP):   $URL_IP"
          echo "URL (host): $URL_HOST"
