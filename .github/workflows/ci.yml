name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts evals
      - run: uv run pytest -q

  test-postgres:
    name: Storage tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aiplatform
          POSTGRES_PASSWORD: aiplatform
          POSTGRES_DB: aiplatform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiplatform"
          --health-interval 2s
          --health-retries 30
    env:
      AIP_TEST_DATABASE_URL: postgresql+asyncpg://aiplatform:aiplatform@localhost:5432/aiplatform_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q -m postgres

  k8s-manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render and validate
        run: |
          docker run --rm -v "$PWD/deploy/k8s:/k8s:ro" registry.k8s.io/kubectl:v1.33.0 \
            kustomize /k8s/overlays/production > rendered.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:latest \
            -strict -summary -ignore-missing-schemas -kubernetes-version 1.33.0 - < rendered.yaml

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: aiplatform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # To publish, log in to your registry and push, e.g.:
      # - uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      # ...then set push: true and tags: ghcr.io/<owner>/aiplatform:${{ github.sha }}
      # (and add `packages: write` to permissions).
