# Local stack: Postgres + 2 app replicas behind a tiny nginx load balancer.
#   docker compose up --build
#   open http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aiplatform
      POSTGRES_PASSWORD: aiplatform
      POSTGRES_DB: aiplatform
    # localhost only: the default passwords must never be reachable from the LAN.
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate aiplatform_test database used by `make test-postgres`.
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiplatform"]
      interval: 2s
      retries: 30

  migrate:
    build: .
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    environment:
      AIP_DATABASE_URL: postgresql+asyncpg://aiplatform:aiplatform@db:5432/aiplatform
    depends_on:
      db: {condition: service_healthy}

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      AIP_DATABASE_URL: postgresql+asyncpg://aiplatform:aiplatform@db:5432/aiplatform
      # Local defaults; override in .env or the shell.
      AIP_AUTH_MODE: ${AIP_AUTH_MODE:-dev}
      AIP_PROVIDERS: ${AIP_PROVIDERS:-["ollama"]}
      AIP_OLLAMA_BASE_URL: ${AIP_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AIP_OLLAMA_MODEL: ${AIP_OLLAMA_MODEL:-qwen2.5:7b}
      # External core-banking DB, read-only role with Row-Level Security (load it with `make bank-db`).
      AIP_BANK_DATABASE_URL: postgresql+asyncpg://bank_reader:${AIP_BANK_READER_PASSWORD:-bank_reader}@db:5432/bank
    extra_hosts: ["host.docker.internal:host-gateway"]
    deploy:
      replicas: 2
    depends_on:
      migrate: {condition: service_completed_successfully}

  lb:
    image: nginx:1.27-alpine
    ports: ["8000:80"]
    volumes: [./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [app]

volumes:
  pgdata:
