# Local stack: Postgres + 2 app replicas behind a tiny nginx load balancer.
#   docker compose up --build
#   open http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aiplatform
      POSTGRES_PASSWORD: aiplatform
      POSTGRES_DB: aiplatform
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiplatform"]
      interval: 2s
      retries: 30

  migrate:
    build: .
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    environment:
      AIP_DATABASE_URL: postgresql+asyncpg://aiplatform:aiplatform@db:5432/aiplatform
    depends_on:
      db: {condition: service_healthy}

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      AIP_DATABASE_URL: postgresql+asyncpg://aiplatform:aiplatform@db:5432/aiplatform
    deploy:
      replicas: 2
    depends_on:
      migrate: {condition: service_completed_successfully}

  lb:
    image: nginx:1.27-alpine
    ports: ["8000:80"]
    volumes: [./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [app]

volumes:
  pgdata:
